name: Build and deploy to Azure Web App

# Deploys the Genie landing page to the "Genie-landing-page" Azure Web App
# on every push to main. Builds the Next.js standalone output in CI and
# ships a ready-to-run bundle (no Oryx build on Azure).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: Genie-landing-page
  NODE_VERSION: "20"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # Not `npm ci`: the lockfile is generated on Windows and can't pin the
        # Linux-only sharp binary's @emnapi optional dep, which fails npm ci's
        # strict sync check. `npm install` lets the Linux runner resolve its
        # own platform packages.
        run: npm install --no-audit --no-fund

      - name: Build (Next.js standalone)
        run: npm run build

      - name: Assemble standalone bundle
        run: |
          # Next standalone output omits static assets and public/ — copy them in.
          cp -r ./.next/static ./.next/standalone/.next/static
          if [ -d ./public ]; then cp -r ./public ./.next/standalone/public; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone
          path: ./.next/standalone
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: standalone
          path: ./standalone

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: ./standalone
